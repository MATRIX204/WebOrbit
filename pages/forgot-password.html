<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · BookMyEvent</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Figtree (clean & professional) -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Figtree', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #d9c4ff 0%, #b79aff 100%);
            padding: 1.5rem;
            position: relative;
        }

        /* subtle geometric pattern – professional touch */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                repeating-linear-gradient(45deg, 
                    rgba(91, 31, 166, 0.03) 0px, 
                    rgba(91, 31, 166, 0.03) 18px,
                    rgba(255, 255, 255, 0.1) 18px,
                    rgba(255, 255, 255, 0.1) 36px);
            z-index: 1;
            pointer-events: none;
        }

        /* main card – elevated, refined, same bold black/white aesthetic */
        .card {
            position: relative;
            z-index: 10;
            background: #ffffff;
            width: 440px;
            max-width: 100%;
            padding: 2.5rem 2.2rem;
            border-radius: 32px;
            border: 2px solid #0f0f0f;
            box-shadow: 16px 16px 0 #0f0f0f, 0 10px 25px -5px rgba(91, 31, 166, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 20px 20px 0 #0f0f0f, 0 20px 30px -8px rgba(91, 31, 166, 0.4);
        }

        /* header area with nice icon */
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }

        .brand-icon {
            background: #5B1FA6;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 2px solid black;
            box-shadow: 5px 5px 0 black;
        }

        h2 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #1e1e1e;
            line-height: 1.1;
        }

        .subhead {
            font-size: 1rem;
            font-weight: 500;
            color: #3f3f3f;
            margin-bottom: 2rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #eae3ff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .subhead i {
            color: #5B1FA6;
            font-size: 0.9rem;
        }

        /* message banner */
        .message {
            background: #f2edff;
            padding: 0.9rem 1.2rem;
            border-radius: 18px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 2px solid black;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 4px 4px 0 rgba(91, 31, 166, 0.2);
            transition: all 0.15s;
            color: #1e1e1e;
        }

        .message i {
            font-size: 1.2rem;
            color: #5B1FA6;
        }

        .message:empty {
            display: none;
        }

        /* input group – modern & crisp */
        .input-group {
            position: relative;
            margin-bottom: 1.8rem;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #5B1FA6;
            transition: color 0.15s;
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            padding: 1.1rem 1.1rem 1.1rem 3.2rem;
            border: 3px solid #1a1a1a;
            border-radius: 20px;
            font-family: 'Figtree', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            background: white;
            outline: none;
            box-shadow: 8px 8px 0 #ded1ff;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }

        .input-group input:focus {
            border-color: #5B1FA6;
            transform: translate(-3px, -3px);
            box-shadow: 12px 12px 0 #cdb9ff;
        }

        .input-group input::placeholder {
            color: #888;
            font-weight: 500;
            opacity: 0.8;
        }

        /* button group – consistent, bold CTA */
        .btn {
            width: 100%;
            padding: 1rem;
            border: 3px solid black;
            font-weight: 700;
            font-family: 'Figtree', sans-serif;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 24px;
            cursor: pointer;
            background: white;
            transition: all 0.2s ease;
            margin-bottom: 0.8rem;
        }

        .btn-primary {
            background: #5B1FA6;
            color: white;
            box-shadow: 7px 7px 0 #0f0f0f;
        }

        .btn-primary:hover {
            background: #4a148c;
            transform: translate(-3px, -3px);
            box-shadow: 10px 10px 0 #0f0f0f;
        }

        .btn-secondary {
            background: white;
            color: black;
            border: 3px solid black;
            box-shadow: 7px 7px 0 #bcb0d0;
        }

        .btn-secondary:hover {
            transform: translate(-3px, -3px);
            box-shadow: 10px 10px 0 #a192c4;
            background: #fbfaff;
        }

        .btn i {
            font-size: 1.1rem;
            color: inherit;
        }

        /* secondary link removes underline */
        a {
            text-decoration: none;
            display: block;
        }

        /* extra micro-text (optional) */
        .info-note {
            font-size: 0.85rem;
            margin-top: 1.2rem;
            text-align: center;
            color: #484848;
            font-weight: 500;
            background: #f6f1ff;
            padding: 0.65rem;
            border-radius: 40px;
            border: 1.5px solid black;
        }

        .info-note i {
            color: #5B1FA6;
            margin-right: 5px;
        }

        /* responsive finesse */
        @media (max-width: 480px) {
            body {
                padding: 0.8rem;
            }
            .card {
                padding: 2rem 1.5rem;
                box-shadow: 12px 12px 0 #0f0f0f;
            }
            .card:hover {
                box-shadow: 16px 16px 0 #0f0f0f;
            }
            h2 {
                font-size: 1.8rem;
            }
            .brand-icon {
                width: 42px;
                height: 42px;
                font-size: 1.4rem;
            }
            .btn {
                padding: 0.9rem;
                font-size: 1rem;
            }
            .input-group input {
                padding: 1rem 1rem 1rem 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="card">
        <!-- small brand/icon area -->
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-regular fa-envelope"></i>
            </div>
            <h2>Reset<br>password</h2>
        </div>

        <!-- subheading with hint -->
        <div class="subhead">
            <i class="fa-solid fa-lock"></i>
            <span>we'll send a reset link to your email</span>
        </div>

        <!-- dynamic message box (inline feedback) -->
        <div id="message" class="message">
            <!-- filled via JS -->
        </div>

        <!-- email field with envelope icon -->
        <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="off">
        </div>

        <!-- primary CTA -->
        <button class="btn btn-primary" id="resetBtn">
            <i class="fa-regular fa-paper-plane"></i> Send reset link
        </button>

        <!-- back to login button wrapped in anchor (acts as link) -->
        <a href="login.html">
            <button class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Back to login
            </button>
        </a>

        <!-- tiny extra note (UI refinement) -->
        <div class="info-note">
            <i class="fa-regular fa-clock"></i> The link expires in 1 hour
        </div>
    </div>

    <!-- Firebase SDK (modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase config (unchanged)
        const firebaseConfig = {
            apiKey: "AIzaSyBc5PBzQQk-W1NDy5-DQ217QbvYsahtiOs",
            authDomain: "bookmyevent-21cd8.firebaseapp.com",
            projectId: "bookmyevent-21cd8",
            storageBucket: "bookmyevent-21cd8.firebasestorage.app",
            messagingSenderId: "535972128829",
            appId: "1:535972128829:web:d07360b589ad13a8dfe254"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM elements
        const emailInput = document.getElementById("email");
        const resetBtn = document.getElementById("resetBtn");
        const messageDiv = document.getElementById("message");

        // Helper to set message with icon & style
        function setMessage(text, isSuccess = false) {
            messageDiv.innerHTML = text ? `<i class="fa-regular ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${text}` : '';
            messageDiv.style.color = isSuccess ? '#14532d' : '#b91c1c';
            messageDiv.style.background = isSuccess ? '#e6f7ec' : '#fee9e7';
            messageDiv.style.borderColor = isSuccess ? '#14532d' : '#b91c1c';
            if (!text) messageDiv.style.display = 'none';
            else messageDiv.style.display = 'flex';
        }

        // clear initial empty message
        setMessage('');

        // Reset password handler
        resetBtn.addEventListener("click", async () => {
            const userEmail = emailInput.value.trim();

            if (!userEmail) {
                setMessage("Enter your email address", false);
                return;
            }

            // simple email regex for quick feedback (optional, but user-friendly)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(userEmail)) {
                setMessage("Please enter a valid email", false);
                return;
            }

            try {
                await sendPasswordResetEmail(auth, userEmail);
                setMessage("Reset link sent! Check your inbox.", true);
                emailInput.value = ''; // optional clear
            } catch (error) {
                // firebase error messages are often long, we shorten them a bit
                let friendlyMessage = error.message;
                if (error.code === 'auth/user-not-found') {
                    friendlyMessage = "No account with this email.";
                } else if (error.code === 'auth/too-many-requests') {
                    friendlyMessage = "Too many attempts. Try later.";
                } else if (error.code === 'auth/invalid-email') {
                    friendlyMessage = "Invalid email format.";
                }
                setMessage(friendlyMessage, false);
            }
        });
    </script>
</body>
</html>
