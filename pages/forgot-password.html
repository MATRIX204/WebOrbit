<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts - Figtree -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Figtree', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #E3D1FF;
            position: relative;
            padding: 30px 15px;
        }


        /* Background pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: repeating-linear-gradient(45deg,
                    rgba(91, 31, 166, 0.03) 0px,
                    rgba(91, 31, 166, 0.03) 10px,
                    rgba(197, 139, 255, 0.03) 10px,
                    rgba(197, 139, 255, 0.03) 20px);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: white;
            border: 4px solid black;
            padding: 40px;
            width: 400px;
            box-shadow: 8px 8px 0 black;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 800;
        }

        input {
            width: 93%;
            padding: 12px;
            margin-bottom: 15px;
            border: 3px solid black;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 3px solid black;
            background: #5B1FA6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7A2CCB;
        }

        .message {
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="bg-pattern"></div>
    <div class="container">
        
        <h2>Reset Password</h2>

        <div id="message" class="message"></div>

        <input type="email" id="email" placeholder="Enter your email">

        <button id="resetBtn">SEND RESET EMAIL</button>

        <p style="margin-top:15px;">
            <a href="login.html">Back to Login</a>
        </p>

    </div>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyBc5PBzQQk-W1NDy5-DQ217QbvYsahtiOs",
            authDomain: "bookmyevent-21cd8.firebaseapp.com",
            projectId: "bookmyevent-21cd8",
            storageBucket: "bookmyevent-21cd8.firebasestorage.app",
            messagingSenderId: "535972128829",
            appId: "1:535972128829:web:d07360b589ad13a8dfe254"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        const email = document.getElementById("email");
        const resetBtn = document.getElementById("resetBtn");
        const message = document.getElementById("message");


        resetBtn.addEventListener("click", async () => {

            const userEmail = email.value.trim();

            if (!userEmail) {
                message.innerHTML = "Enter your email";
                message.style.color = "red";
                return;
            }

            try {

                await sendPasswordResetEmail(auth, userEmail);

                message.innerHTML = "Password reset email sent!";
                message.style.color = "green";

            } catch (error) {

                message.innerHTML = error.message;
                message.style.color = "red";

            }

        });

    </script>

</body>

</html>
