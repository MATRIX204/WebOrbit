<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Figtree', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E3D1FF;
            padding: 30px 15px;
            position: relative;
        }

        /* background pattern */

        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background-image: repeating-linear-gradient(45deg,
                    rgba(91, 31, 166, 0.05) 0px,
                    rgba(91, 31, 166, 0.05) 10px,
                    rgba(197, 139, 255, 0.05) 10px,
                    rgba(197, 139, 255, 0.05) 20px);

            z-index: 1;
            pointer-events: none;
        }

        /* container */

        .container {

            position: relative;
            z-index: 10;

            background: white;
            border: 4px solid black;

            width: 420px;
            max-width: 100%;

            padding: 40px;

            box-shadow: 10px 10px 0 black;

            border-radius: 10px;

        }

        /* heading */

        h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtext {
            margin-bottom: 20px;
            font-size: 14px;
            color: #444;
        }

        /* message */

        .message {
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* input */

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #5B1FA6;
        }

        input {

            width: 100%;

            padding: 14px 14px 14px 40px;

            border: 3px solid black;

            font-family: 'Figtree';

            font-size: 15px;

            outline: none;

            box-shadow: 4px 4px 0 #E3D1FF;

        }

        input:focus {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #E3D1FF;
        }

        /* buttons */

        .btn {

            width: 100%;

            padding: 14px;

            border: 3px solid black;

            font-weight: 700;

            cursor: pointer;

            font-family: 'Figtree';

            text-transform: uppercase;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            margin-top: 5px;

        }

        /* reset button */

        .btn-primary {

            background: #5B1FA6;
            color: white;

            box-shadow: 5px 5px 0 black;

        }

        .btn-primary:hover {

            transform: translate(-2px, -2px);

            box-shadow: 7px 7px 0 black;

        }

        /* back button */

        .btn-secondary {

            background: white;
            color: black;

            margin-top: 10px;

            box-shadow: 5px 5px 0 #bbb;

        }

        .btn-secondary:hover {

            transform: translate(-2px, -2px);

            box-shadow: 7px 7px 0 #bbb;

        }

        /* mobile */

        @media(max-width:500px) {

            .container {
                padding: 30px 20px;
            }

        }
    </style>
</head>

<body>

    <div class="bg-pattern"></div>

    <div class="container">

        <h2>Reset Password</h2>

        <div class="subtext">
            Enter your email to receive a password reset link.
        </div>

        <div id="message" class="message"></div>

        <div class="input-group">
            <i class="fa fa-envelope"></i>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <button id="resetBtn" class="btn btn-primary">
            <i class="fa fa-paper-plane"></i>
            Send Reset Email
        </button>

        <a href="login.html">
            <button class="btn btn-secondary">
                <i class="fa fa-arrow-left"></i>
                Back to Login
            </button>
        </a>

    </div>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBc5PBzQQk-W1NDy5-DQ217QbvYsahtiOs",
            authDomain: "bookmyevent-21cd8.firebaseapp.com",
            projectId: "bookmyevent-21cd8",
            storageBucket: "bookmyevent-21cd8.firebasestorage.app",
            messagingSenderId: "535972128829",
            appId: "1:535972128829:web:d07360b589ad13a8dfe254"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const email = document.getElementById("email");
        const resetBtn = document.getElementById("resetBtn");
        const message = document.getElementById("message");

        resetBtn.addEventListener("click", async () => {

            const userEmail = email.value.trim();

            if (!userEmail) {

                message.innerHTML = "Enter your email";
                message.style.color = "red";
                return;

            }

            try {

                await sendPasswordResetEmail(auth, userEmail);

                message.innerHTML = "Password reset email sent!";
                message.style.color = "green";

            } catch (error) {

                message.innerHTML = error.message;
                message.style.color = "red";

            }

        });

    </script>

</body>

</html>
