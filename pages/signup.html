<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>BookMyEvent - Create Account</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts - Figtree -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Figtree', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            position: relative;
            padding: 30px 15px;
        }


        /* Background pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 30% 40%, rgba(91, 31, 166, 0.03) 0%, transparent 30%),
                radial-gradient(circle at 70% 60%, rgba(156, 77, 255, 0.03) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(91, 31, 166, 0.02) 0px, rgba(91, 31, 166, 0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 1;
        }

        /* Main container */
        .container {
            max-width: 1150px;
            width: 100%;
            background-color: #5B1FA6;
            border: 4px solid #000;
            box-shadow: 14px 14px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            border-radius: 18px;
            margin: auto;
        }


        /* Content card with image and form side by side */
        .content {
            background-color: #FFFFFF;
            border: 4px solid #000;
            margin: 15px;
            display: flex;
            overflow: hidden;
            position: relative;
            border-radius: 14px;
        }


        /* Left side - Image */
        .signup-image {
            flex: 1.1;
            background: linear-gradient(135deg, #5B1FA6, #9C4DFF);
            border-right: 4px solid #000;
            position: relative;
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }


        .signup-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.5s ease;
        }

        .signup-image:hover img {
            transform: scale(1.1);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(91, 31, 166, 0.5), rgba(156, 77, 255, 0.5));
            z-index: 2;
        }

        .image-content {
            position: relative;
            z-index: 3;
            color: #FFFFFF;
            text-align: center;
            padding: 40px;
            max-width: 400px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-content .badge {
            background: #FFFFFF;
            color: #5B1FA6;
            padding: 10px 20px;
            border: 3px solid #000;
            font-weight: 800;
            font-size: 1rem;
            display: inline-block;
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 8px 8px 0 #000;
            border-radius: 10px;
        }

        .image-content h3 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            margin-bottom: 20px;
            text-shadow: 6px 6px 0 #000;
            line-height: 1.1;
        }

        .image-content p {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 35px;
            text-shadow: 3px 3px 0 #000;
            opacity: 0.95;
        }

        .feature-list {
            text-align: left;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid #FFFFFF;
            padding: 25px;
            backdrop-filter: blur(8px);
            border-radius: 15px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            color: #FFFFFF;
            font-weight: 600;
            text-shadow: 2px 2px 0 #000;
            font-size: 1.1rem;
        }

        .feature-item i {
            width: 30px;
            height: 30px;
            background: #FFFFFF;
            color: #5B1FA6;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border-radius: 8px;
        }

        /* Right side - Sign Up Form */
        .signup-form-section {
            flex: 1;
            padding: 40px 35px;
            background: #FFFFFF;
            overflow-y: auto;
            max-height: 600px;
        }


        /* Custom scrollbar */
        .signup-form-section::-webkit-scrollbar {
            width: 8px;
        }

        .signup-form-section::-webkit-scrollbar-track {
            background: #E3D1FF;
            border: 2px solid #000;
            border-radius: 10px;
        }

        .signup-form-section::-webkit-scrollbar-thumb {
            background: #5B1FA6;
            border: 2px solid #000;
            border-radius: 10px;
        }

        /* Back button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #5B1FA6;
            font-size: 1rem;
            text-decoration: none;
            border: 3px solid #000;
            padding: 10px 18px;
            background: #FFFFFF;
            box-shadow: 5px 5px 0 #000;
            transition: all 0.2s ease;
            font-weight: 700;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .back-btn:hover {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #000;
        }

        /* Logo */
        .logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .logo-text .book {
            color: #5B1FA6;
            background: #E3D1FF;
            padding: 8px 12px;
            border: 3px solid #000;
            display: inline-block;
            border-radius: 8px;
        }

        .logo-text .my {
            color: #FFFFFF;
            background: linear-gradient(135deg, #7A2CCB, #9C4DFF);
            padding: 8px 12px;
            border: 3px solid #000;
            display: inline-block;
            margin: 0 5px;
            border-radius: 8px;
        }

        .logo-text .event {
            color: #FFFFFF;
            background: #5B1FA6;
            padding: 8px 12px;
            border: 3px solid #000;
            display: inline-block;
            border-radius: 8px;
        }

        /* Headline */
        h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #000;
            letter-spacing: -2px;
        }

        .subhead {
            color: #5B1FA6;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }

        .subhead::before,
        .subhead::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, #5B1FA6, #9C4DFF);
            border: 2px solid #000;
            border-radius: 4px;
        }

        .subhead::before {
            left: -50px;
        }

        .subhead::after {
            right: -50px;
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            color: #5B1FA6;
            font-size: 1.2rem;
            z-index: 2;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px 16px 48px;
            font-family: 'Figtree', sans-serif;
            font-size: 1rem;
            border: 3px solid #000;
            background: #FFFFFF;
            box-shadow: 4px 4px 0 #E3D1FF;
            transition: all 0.15s ease;
            outline: none;
            border-radius: 10px;
        }


        .form-input:focus {
            box-shadow: 3px 3px 0 #5B1FA6;
            transform: translate(3px, 3px);
            border-color: #5B1FA6;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            cursor: pointer;
            color: #5B1FA6;
            font-size: 1.2rem;
            z-index: 2;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #9C4DFF;
        }

        /* Password strength */
        .password-strength {
            margin-top: 10px;
            height: 8px;
            background: #E3D1FF;
            border: 2px solid #000;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
            border-radius: 8px;
        }

        .strength-text {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 8px;
            text-align: right;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            font-family: 'Figtree', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 4px solid #000;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            border-radius: 12px;
        }


        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5B1FA6, #7A2CCB);
            color: #FFFFFF;
            box-shadow: 8px 8px 0 #9C4DFF;
        }

        .btn-primary:hover {
            transform: translate(5px, 5px);
            box-shadow: 3px 3px 0 #C58BFF;
        }

        .btn-google {
            background: #FFFFFF;
            color: #5B1FA6;
            box-shadow: 8px 8px 0 #C58BFF;
            border: 4px solid #5B1FA6;
        }

        .btn-google:hover {
            transform: translate(5px, 5px);
            box-shadow: 3px 3px 0 #E3D1FF;
            background: #F5F0FF;
        }

        .btn-google img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.1));
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .divider-line {
            flex: 1;
            height: 4px;
            background: linear-gradient(90deg, transparent, #5B1FA6, #9C4DFF, #C58BFF, transparent);
            border-radius: 4px;
        }

        .divider-text {
            font-weight: 700;
            color: #5B1FA6;
            background: #FFFFFF;
            padding: 0 20px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Terms */
        .terms {
            font-size: 0.8rem;
            color: #2D2D2D;
            margin: 20px 0 15px;
            line-height: 1.6;
            padding: 15px;
            background: #F9F5FF;
            border: 3px solid #000;
            border-radius: 12px;
        }

        .terms a {
            color: #5B1FA6;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid #E3D1FF;
            transition: border-color 0.2s;
        }

        .terms a:hover {
            border-bottom-color: #5B1FA6;
        }

        /* Login link */
        .login-link {
            margin-top: 25px;
            font-weight: 500;
            color: #2D2D2D;
            font-size: 1rem;
            padding: 15px;
            background: #E3D1FF;
            border: 3px solid #000;
            text-align: center;
            border-radius: 12px;
        }

        .login-link a {
            color: #5B1FA6;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid #FFFFFF;
            margin-left: 5px;
            transition: border-color 0.2s;
        }

        .login-link a:hover {
            border-bottom-color: #5B1FA6;
        }

        /* Messages */
        .error-message,
        .success-message {
            padding: 15px;
            margin-bottom: 25px;
            border: 4px solid #000;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
        }

        .error-message {
            background: #FFE5E5;
            border-color: #FF0000;
            color: #FF0000;
            box-shadow: 6px 6px 0 #FFA500;
        }

        .success-message {
            background: #E3FFE5;
            border-color: #00C851;
            color: #00C851;
            box-shadow: 6px 6px 0 #5B1FA6;
        }

        .error-message i,
        .success-message i {
            font-size: 1.3rem;
        }

        /* Corner accents */
        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 4px solid #000;
            z-index: 20;
        }

        .container .corner-tl {
            border-radius: 18px 0px 0px 0px;
            top: -4px;
            left: -4px;
        }

        .container .corner-br {
            border-radius: 0px 0px 18px 0px;
            bottom: -4px;
            right: -4px;
        }


        /* Loading spinner */
        .fa-spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Fade in animation */
        .content {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulse animation for image content */
        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .image-content .badge {
            animation: pulse 2s infinite;
        }

        /* Mobile responsive */
        @media screen and (max-width: 900px) {

            body {
                padding: 20px 10px;
            }

            .content {
                flex-direction: column;
                margin: 10px;
            }

            .signup-image {
                min-height: 220px;
                border-right: none;
                border-bottom: 4px solid #000;
            }

            .signup-form-section {
                max-height: none;
                padding: 30px 20px;
            }

        }


        @media screen and (max-width: 480px) {
            .signup-form-section {
                padding: 25px 15px;
            }

            .logo-text {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 2rem;
            }

            .form-input {
                padding: 16px 15px 16px 45px;
                font-size: 0.95rem;
            }

            .btn {
                padding: 16px;
                font-size: 1rem;
            }

            .back-btn {
                font-size: 0.9rem;
                padding: 8px 12px;
            }

            .image-content h3 {
                font-size: 2rem;
            }

            .image-content p {
                font-size: 1rem;
            }

            .subhead::before,
            .subhead::after {
                display: none;
            }
        }

        @media screen and (max-width: 360px) {
            .logo-text {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.8rem;
            }

            .subhead {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <!-- Background pattern -->
    <div class="bg-pattern"></div>
    <!-- Main Container -->
    <div class="container">
        <!-- Corner accents -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>
        <div class="content">
            <!-- Left side - Image -->
            <div class="signup-image">
                <img src="../assets/images/signup.png" alt="Join BookMyEvent">
                <div class="image-overlay"></div>
                
            </div>

            <!-- Right side - Sign Up Form -->
            <div class="signup-form-section">
                <!-- Back button -->
                <a href="../index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> BACK TO HOME
                </a>

     
                <!-- Headline -->
                <h2>CREATE ACCOUNT</h2>
                <div class="subhead">JOIN THE COMMUNITY</div>

                <!-- Error message container -->
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <!-- Success message container -->
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span id="successText"></span>
                </div>

                <!-- Sign Up Form -->
                <form id="signupForm">
                    <div class="form-group">
                        <label class="form-label">FULL NAME</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" class="form-input" id="username" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">EMAIL ADDRESS</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" class="form-input" id="email" placeholder="hello@bookmyevent.com"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">PASSWORD</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" class="form-input" id="password"
                                placeholder="Create a strong password" required>
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                        <!-- Password strength indicator -->
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="strength-text" id="strengthText">ENTER PASSWORD</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">CONFIRM PASSWORD</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" class="form-input" id="confirmPassword"
                                placeholder="Confirm your password" required>
                            <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="signupBtn">
                        <i class="fas fa-user-plus"></i> CREATE ACCOUNT
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">OR</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Google Sign Up -->
                <button class="btn btn-google" id="googleSignUp">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    CONTINUE WITH GOOGLE
                </button>

                <!-- Terms -->
                <div class="terms">
                    BY CREATING AN ACCOUNT, YOU AGREE TO OUR <a href="#">TERMS OF SERVICE</a> AND <a href="#">PRIVACY
                        POLICY</a>
                </div>

                <!-- Login link -->
                <div class="login-link">
                    ALREADY HAVE AN ACCOUNT? <a href="login.html">SIGN IN</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile,
            signInWithPopup,
            GoogleAuthProvider
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBc5PBzQQk-W1NDy5-DQ217QbvYsahtiOs",
            authDomain: "bookmyevent-21cd8.firebaseapp.com",
            projectId: "bookmyevent-21cd8",
            storageBucket: "bookmyevent-21cd8.firebasestorage.app",
            messagingSenderId: "535972128829",
            appId: "1:535972128829:web:d07360b589ad13a8dfe254",
            measurementId: "G-R0DF8W0N81"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const signupForm = document.getElementById('signupForm');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const signupBtn = document.getElementById('signupBtn');
        const googleSignUp = document.getElementById('googleSignUp');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');
        const successText = document.getElementById('successText');
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        // Toggle password visibility
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        toggleConfirmPassword.addEventListener('click', function () {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Password strength checker
        passwordInput.addEventListener('input', function () {
            const password = this.value;
            const strength = checkPasswordStrength(password);

            // Update strength bar
            strengthBar.style.width = strength.score + '%';
            strengthBar.style.background = strength.color;
            strengthText.textContent = strength.message;
            strengthText.style.color = strength.color;
        });

        function checkPasswordStrength(password) {
            let score = 0;
            let message = '';
            let color = '#FF0000';

            if (password.length === 0) {
                return { score: 0, message: 'ENTER PASSWORD', color: '#5B1FA6' };
            }

            // Length check
            if (password.length >= 8) score += 25;

            // Uppercase check
            if (/[A-Z]/.test(password)) score += 25;

            // Number check
            if (/[0-9]/.test(password)) score += 25;

            // Special character check
            if (/[^A-Za-z0-9]/.test(password)) score += 25;

            // Determine message and color
            if (score <= 25) {
                message = 'WEAK PASSWORD';
                color = '#FF4444';
            } else if (score <= 50) {
                message = 'FAIR PASSWORD';
                color = '#FFA500';
            } else if (score <= 75) {
                message = 'GOOD PASSWORD';
                color = '#9C4DFF';
            } else {
                message = 'STRONG PASSWORD';
                color = '#00C851';
            }

            return { score, message, color };
        }

        // Show error function
        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'flex';
            successMessage.style.display = 'none';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Show success function
        function showSuccess(message) {
            successText.textContent = message;
            successMessage.style.display = 'flex';
            errorMessage.style.display = 'none';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        // Create user document in Firestore
        async function createUserDocument(user, username) {
            try {
                const userRef = doc(db, 'users', user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email,
                    fullName: username || user.displayName || '',
                    displayName: username || user.displayName || '',
                    photoURL: user.photoURL || '',
                    phone: '',
                    age: '',
                    state: '',
                    city: '',
                    bio: '',
                    interests: [],
                    eventHistory: [],
                    profileCompleted: false,
                    createdAt: serverTimestamp(),
                    lastLogin: serverTimestamp(),
                    emailVerified: user.emailVerified,
                    accountType: 'user'
                });
                console.log('User document created successfully');
            } catch (error) {
                console.error('Error creating user document:', error);
                throw error;
            }
        }

        // Email/Password Sign Up
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            // Validation
            if (!username || !email || !password || !confirmPassword) {
                showError('PLEASE FILL IN ALL FIELDS');
                return;
            }

            if (username.length < 2) {
                showError('NAME MUST BE AT LEAST 2 CHARACTERS');
                return;
            }

            if (password.length < 6) {
                showError('PASSWORD MUST BE AT LEAST 6 CHARACTERS');
                return;
            }

            if (password !== confirmPassword) {
                showError('PASSWORDS DO NOT MATCH');
                return;
            }

            // Show loading state
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CREATING ACCOUNT...';
            signupBtn.disabled = true;

            try {
                // Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Update profile with username
                await updateProfile(user, {
                    displayName: username
                });

                // Create user document in Firestore
                await createUserDocument(user, username);

                console.log('Signup successful:', user.email);

                showSuccess('ACCOUNT CREATED! WELCOME TO BOOKMYEVENT!');

                // Redirect to home page
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);

            } catch (error) {
                console.error('Signup error:', error);

                // Handle specific error codes
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        showError('EMAIL ALREADY REGISTERED');
                        break;
                    case 'auth/invalid-email':
                        showError('INVALID EMAIL FORMAT');
                        break;
                    case 'auth/weak-password':
                        showError('PASSWORD TOO WEAK (MIN 6 CHARACTERS)');
                        break;
                    default:
                        showError('SIGNUP FAILED. PLEASE TRY AGAIN');
                }

                // Reset button
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> CREATE ACCOUNT';
                signupBtn.disabled = false;
            }
        });

        // Google Sign Up
        googleSignUp.addEventListener('click', async () => {
            // Show loading state
            googleSignUp.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CONNECTING...';
            googleSignUp.disabled = true;

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                console.log('Google signup successful:', user.email);

                // Check if user document exists, if not create it
                const userRef = doc(db, 'users', user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email,
                    fullName: user.displayName || '',
                    displayName: user.displayName || '',
                    photoURL: user.photoURL || '',
                    phone: '',
                    age: '',
                    state: '',
                    city: '',
                    bio: '',
                    interests: [],
                    eventHistory: [],
                    profileCompleted: false,
                    createdAt: serverTimestamp(),
                    lastLogin: serverTimestamp(),
                    emailVerified: user.emailVerified,
                    accountType: 'user'
                }, { merge: true }); // Use merge to not overwrite existing data

                showSuccess('GOOGLE SIGN UP SUCCESSFUL!');

                // Redirect to home page
                setTimeout(() => {
                    window.location.href = 'pages/home.html';
                }, 1500);

            } catch (error) {
                console.error('Google signup error:', error);

                // Handle specific Google errors
                switch (error.code) {
                    case 'auth/popup-blocked':
                        showError('POPUP WAS BLOCKED. PLEASE ALLOW POPUPS.');
                        break;
                    case 'auth/popup-closed-by-user':
                        showError('SIGN UP CANCELLED. PLEASE TRY AGAIN.');
                        break;
                    case 'auth/unauthorized-domain':
                        showError('DOMAIN NOT AUTHORIZED. CHECK FIREBASE CONSOLE.');
                        break;
                    default:
                        showError('GOOGLE SIGN UP FAILED. TRY AGAIN.');
                }

                // Reset button
                googleSignUp.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> CONTINUE WITH GOOGLE';
                googleSignUp.disabled = false;
            }
        });

        // Console welcome
        console.log('%c📝 BookMyEvent - Premium Sign Up Portal', 'color: #5B1FA6; font-size: 16px; font-weight: bold;');
        console.log('%c📍 Firestore Integration Active - User documents will be created', 'color: #00C851; font-size: 12px;');
    </script>
</body>
